[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "szpont-news"
version = "0.1.0"
description = "Auditable macro, geopolitical and crypto event-risk radar"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
szpont-news = "szpont_news.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"
